# =============================================================================
# linkyee — Site Configuration for Gamgrace
# =============================================================================

# Theme — directory under ./themes/
theme: newsprint

# HTML <html lang> attribute
lang: "en"

# Force a color scheme: auto | light | dark
color_scheme: auto

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins: []

# -----------------------------------------------------------------------------
# Tracking (GA4 Measurement ID)
# -----------------------------------------------------------------------------
google_analytics_id: ""

# -----------------------------------------------------------------------------
# Profile header
# -----------------------------------------------------------------------------
title: "Gamgrace | Premium Seamless Activewear & High-Performance Knitwear"
avatar: "https://cdn.shopify.com/s/files/1/0724/3936/5676/files/20260724112902_356_89.png?v=1784970742"
name: "@Gamgrace"
tagline: >-
  Discover Gamgrace seamless knitwear. Combining high-performance fabric with elegant, sculpting designs. Premium activewear crafted for ultimate comfort.

# -----------------------------------------------------------------------------
# Links (上半部分：官方商店与客户服务)
# -----------------------------------------------------------------------------
links:
  # 官方商城入口（带 UTM 参数便于 GA4 精准归因）
  - link:
      icon: "fa-solid fa-store"
      text: "Official Store"
      url: "https://gamgrace.com?utm_source=linkyee&utm_medium=bio&utm_campaign=brand_hub&utm_content=official_store_btn"
      alt: "Visit Gamgrace Official Store"
      title: "Visit Gamgrace Official Store"
      target: "_blank"

  # 客服 Messenger 对话
  - link:
      icon: "fa-brands fa-facebook-messenger"
      text: "Chat on Messenger"
      url: "https://m.me/1133724523154857"
      alt: "Chat with Gamgrace on Messenger"
      title: "Chat with Gamgrace on Messenger"
      target: "_blank"

  # 客服邮箱
  - link:
      icon: "fa-solid fa-envelope"
      text: "Customer Support Email"
      url: "mailto:support@gamgrace.com"
      alt: "Email Gamgrace Customer Support"
      title: "Email Gamgrace Customer Support"
      target: "_blank"

# -----------------------------------------------------------------------------
# Socials (下半部分：官方社媒矩阵)
# -----------------------------------------------------------------------------
socials:
  - social:
      icon: "fa-brands fa-instagram"
      url: "https://www.instagram.com/gamgrace_official"
      title: "Instagram"
      alt: "Gamgrace Instagram"
      target: "_blank"

  - social:
      icon: "fa-brands fa-threads"
      url: "https://threads.net/@gamgrace_official"
      title: "Threads"
      alt: "Gamgrace Threads"
      target: "_blank"

  - social:
      icon: "fa-brands fa-facebook"
      url: "https://facebook.com/61589181463767"
      title: "Facebook"
      alt: "Gamgrace Facebook"
      target: "_blank"

  - social:
      icon: "fa-brands fa-tiktok"
      url: "https://www.tiktok.com/@gamgrace.official"
      title: "TikTok"
      alt: "Gamgrace TikTok"
      target: "_blank"

  - social:
      icon: "fa-brands fa-pinterest"
      url: "https://www.pinterest.com/gamgraceofficial/"
      title: "Pinterest"
      alt: "Gamgrace Pinterest"
      target: "_blank"
# -----------------------------------------------------------------------------
# Footer & Copyright
# -----------------------------------------------------------------------------
footer: "High-Performance Fabric. Sculpting Design. Ultimate Comfort."

copyright: >
  © {{ year }} <a href="https://gamgrace.com" target="_blank" rel="noopener">Gamgrace</a>. All rights reserved.
